<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="ball" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0a3a55"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="100%" stop-color="#0a1224"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- grid -->
  <g stroke="#00f0ff" stroke-opacity="0.08" stroke-width="1">
    <path d="M0 96 H512 M0 192 H512 M0 288 H512 M0 384 H512"/>
    <path d="M96 0 V512 M192 0 V512 M288 0 V512 M384 0 V512"/>
  </g>
  <!-- speed lines -->
  <g stroke="#ff2d78" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round">
    <line x1="80"  y1="380" x2="180" y2="380"/>
    <line x1="60"  y1="420" x2="200" y2="420"/>
    <line x1="100" y1="340" x2="160" y2="340"/>
  </g>
  <!-- halo -->
  <circle cx="300" cy="240" r="200" fill="url(#halo)"/>
  <!-- ball -->
  <circle cx="300" cy="240" r="135" fill="url(#ball)" stroke="#003e55" stroke-width="3"/>
  <!-- highlight -->
  <ellipse cx="255" cy="195" rx="38" ry="22" fill="#ffffff" fill-opacity="0.55"/>
</svg>
